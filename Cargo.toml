[package]
name = "gopal"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
leptos = { version = "0.8.15", features = ["nightly", "ssr"] }
leptos_axum = "0.8.7"
leptos_meta = { version = "0.8.5", features = ["ssr"] }
leptos_router = { version = "0.8.11", features = ["nightly", "ssr"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
thiserror = "2"
http = "1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
tempfile = "3.24"
regex = "1.0"
